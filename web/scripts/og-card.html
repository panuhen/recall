<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #111111;
    font-family: 'IBM Plex Sans', sans-serif;
    color: #ffffff;
  }
  .graph { position: absolute; inset: 0; }
  .brand {
    position: absolute;
    left: 80px;
    top: 130px;
    display: flex;
    align-items: center;
    gap: 22px;
    font-size: 44px;
    font-weight: 600;
    letter-spacing: -0.5px;
  }
  .brand svg { width: 60px; height: 58px; }
  h1 {
    position: absolute;
    left: 80px;
    top: 232px;
    font-size: 59px;
    font-weight: 600;
    line-height: 76px;
    letter-spacing: -0.8px;
  }
  p {
    position: absolute;
    left: 80px;
    top: 394px;
    width: 720px;
    font-size: 22px;
    line-height: 37px;
    color: #9a9a9a;
  }
</style>
</head>
<body>
  <!-- Graph motif: grey nodes, one highlighted in the accent blue. -->
  <svg class="graph" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
    <g stroke="#333333" stroke-width="1.2" fill="none">
      <line x1="689" y1="134" x2="870" y2="102"/>
      <line x1="870" y1="102" x2="1040" y2="195"/>
      <line x1="689" y1="134" x2="775" y2="310"/>
      <line x1="870" y1="102" x2="965" y2="345"/>
      <line x1="1040" y1="195" x2="1080" y2="450"/>
      <line x1="775" y1="310" x2="965" y2="345"/>
      <line x1="965" y1="345" x2="1080" y2="450"/>
      <line x1="965" y1="345" x2="905" y2="524"/>
      <line x1="775" y1="310" x2="680" y2="485"/>
      <line x1="680" y1="485" x2="905" y2="524"/>
      <line x1="905" y1="524" x2="1080" y2="450"/>
    </g>
    <g fill="#444444">
      <circle cx="689" cy="134" r="5"/>
      <circle cx="870" cy="102" r="5"/>
      <circle cx="1040" cy="195" r="5"/>
      <circle cx="775" cy="310" r="5"/>
      <circle cx="1080" cy="450" r="5"/>
      <circle cx="680" cy="485" r="5"/>
      <circle cx="905" cy="524" r="5"/>
    </g>
    <circle cx="965" cy="345" r="9" fill="#4a90e2"/>

  <div class="brand">
    <!-- Same mark as src/static/favicon.svg, in white. -->
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path fill="#ffffff" d="M12.00,0.94 L23.70,22.00 L5.45,22.00 L6.56,20.00 L20.30,20.00 L12.00,5.06 L2.59,22.00 L0.30,22.00Z"/>
    </svg>
    re:call
  </div>

  <h1>Your team's knowledge base<br>is also your AI's memory.</h1>

  <p>Open-source, self-hosted, and behind SSO, with a native MCP interface so AI assistants work from the same notes your team writes.</p>

</html>
