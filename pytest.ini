[pytest]
# Auto mode: async test functions and async fixtures are handled without
# per-test @pytest.mark.asyncio boilerplate. Everything here is function-scoped,
# so each test + its autouse fixtures share one event loop (see tests/conftest.py
# for why the asyncpg pool is (re)created per test).
asyncio_mode = auto
testpaths = tests
addopts = -q
